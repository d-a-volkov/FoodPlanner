services:
  foodplanner-api:
    image: foodplanner-api:1.0.0
    build:
      context: .
      dockerfile: FoodPlanner.Api/Dockerfile
    ports:
      - "7215:8080"
    environment:
      ASPNETCORE_URLS: http://+:8080
      DataPath: /data
      FrontendPath: /app/webdist
      Kuper__BridgeUrl: http://kuper-bridge:8082
      Kuper__DataPath: /data
    volumes:
      - foodplanner_data:/data
    networks:
      - foodplanner-net
    restart: unless-stopped
    depends_on:
      - kuper-bridge

  kuper-bridge:
    image: kuper-bridge:0.3.0
    build:
      context: ./KuperBridge
      dockerfile: Dockerfile
    environment:
      KUPER_STATE: /data/kuper_state.json
    volumes:
      - foodplanner_data:/data
    networks:
      - foodplanner-net
    restart: unless-stopped

volumes:
  foodplanner_data:

networks:
  foodplanner-net:
